# ============================================================
# DUBBING PROJECT — GLOBAL CONFIGURATION
# ============================================================

project:
  name: "dubbing_v2"
  version: "1.0.0"

# ============================================================
# PATHS
# ============================================================
paths:
  data_input:   "data/input"
  data_audio:   "data/audio"
  data_output:  "data/outputs"
  jobs:         "jobs"
  models_cache: "models/cache"
  logs:         "logs"
  stages:       "stages"

# ============================================================
# LANGUAGE SETTINGS
# ============================================================
language:
  source:            "auto"
  bridge:            "en"
  target:            "en"
  target_name:       "English"
  code_mixing:       false
  code_mixing_style: "tenglish"

# ============================================================
# HARDWARE
# ============================================================
hardware:
  gpu_available: true
  vram_gb:       4
  ram_gb:        16
  device:        "cuda"
  cpu_fallback:  true

# ============================================================
# STAGE SETTINGS
# ============================================================
stages:

  # ----------------------------------------------------------
  # STAGE 00 — Vocal Separation (BS-Roformer only)
  # ----------------------------------------------------------
  vocals:
    env_name:          "dub_vocals"
    bs_roformer_model: "model_bs_roformer_ep_317_sdr_12.9755.ckpt"
    model_cache_dir:   "/mnt/d/$/dub_requirements/hf_cache/audio_separator_models"

  # ----------------------------------------------------------
  # STAGE 01 — ASR (Speech Recognition)
  # ----------------------------------------------------------
  asr:
    env_name:                     "dub_asr"
    model:                        "large-v3"
    device:                       "cuda"
    language:                     "en"
    temperature:                  0.0
    logprob_threshold:           -1.0
    no_speech_threshold:          0.6
    condition_on_previous_text:   false
    compression_ratio_threshold:  2.4

  # ----------------------------------------------------------
  # STAGE 01b — Speaker Diarization
  # ----------------------------------------------------------
  diarization:
    env_name:               "dub_diar"
    device:                 "cuda"
    max_num_speakers:       50
    distance_threshold:     0.60
    speaker_profile_min_s:  3.0
    speaker_profile_max_s:  10000.0
    hf_token:               ""

  # ----------------------------------------------------------
  # STAGE 03 — Translation
  # ----------------------------------------------------------
  translation:
    env_name:    "dub_translate"
    model:       "ai4bharat/indictrans2-en-indic-dist-200M"
    device:      "cuda"
    code_mixing: true
    keep_english:
      - named_entities
      - technical_terms
      - loanwords
      - short_neutral_words

  # ----------------------------------------------------------
  # STAGE 04 — TTS (Voice Synthesis)
  # Ref audio: dialogue slice from _vocals.wav (>= min_ref_duration_s)
  # Fallback:  speaker_profiles/speaker_XX.wav if dialogue too short
  # ----------------------------------------------------------
  tts:
    env_name:           "dub_tts"
    model:              "drbaph/OmniVoice-bf16"
    device:             "cuda"
    sample_rate:        24000
    min_ref_duration_s: 1.0

  # ----------------------------------------------------------
  # STAGE 05 — Assembly
  # Background: {job_id}_no_vocals.wav (BS-Roformer BGM+SFX)
  # ----------------------------------------------------------
  assembly:
    env_name:               "dub_assembly"
    sample_rate:            24000
    timestamp_tolerance_ms: 80
    fade_ms:                10
    nonlexical_sounds:
      - "hmm"
      - "uh"
      - "ah"
      - "ha"
      - "hey"
      - "ok"
      - "okay"
      - "no"
      - "yeah"
      - "hm"
      - "um"

# ============================================================
# PIPELINE CONTROL
# ============================================================
pipeline:
  run_stages:
    - "00_vocals"
    - "01_asr"
    - "01b_diarization"
    - "03_translation"
    - "04_tts"
    - "05_assembly"
  stop_on_error: true
  restart_safe:  true