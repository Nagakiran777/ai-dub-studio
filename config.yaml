# ============================================================
# DUBBING PROJECT — GLOBAL CONFIGURATION
# ============================================================

project:
  name: "dubbing_v2"
  version: "1.0.0"

# ============================================================
# PATHS
# ============================================================
paths:
  # Every job keeps ALL its files inside jobs/<job_id>/ :
  #   source/ (video)  audio/ (original, vocals, no_vocals)  output/ (exported video)  logs/  + stage data
  # so a job can be zipped ("Zip this job") and imported into any AI Dub Studio.
  # The three data_* folders below are the OLD layout — only read when an old job is moved
  # into its own folder automatically; nothing new is written there.
  data_input:   "data/input"
  data_audio:   "data/audio"
  data_output:  "data/outputs"
  jobs:         "jobs"
  models_cache: "models/cache"
  logs:         "logs"
  stages:       "stages"

# ============================================================
# LANGUAGE SETTINGS
# ============================================================
language:
  source:            "auto"
  bridge:            "en"
  target:            "en"
  target_name:       "English"
  code_mixing:       false
  code_mixing_style: "tenglish"

# ============================================================
# HARDWARE
# ============================================================
hardware:
  gpu_available: true
  vram_gb:       4
  ram_gb:        16
  device:        "cuda"
  cpu_fallback:  true

# ============================================================
# STAGE SETTINGS
# ============================================================
stages:

  # ----------------------------------------------------------
  # STAGE 00 — Vocal Separation (BS-Roformer only)
  # ----------------------------------------------------------
  vocals:
    env_name:          "dub_vocals"
    bs_roformer_model: "model_bs_roformer_ep_317_sdr_12.9755.ckpt"
    model_cache_dir:   "/mnt/d/$/dub_requirements/hf_cache/audio_separator_models"

  # ----------------------------------------------------------
  # STAGE 01 — ASR (Speech Recognition)
  # ----------------------------------------------------------
  asr:
    env_name:                     "dub_asr"
    # Whisper model: "medium" (recommended default) or "large-v3". The UI choice per job
    # (Select ASR model in the pipeline panel) overrides this; this is only the fallback.
    model:                        "medium"
    device:                       "cuda"
    language:                     "en"
    temperature:                  0.0
    logprob_threshold:           -1.0
    no_speech_threshold:          0.6
    condition_on_previous_text:   false
    compression_ratio_threshold:  2.4
    # Engine for the experiment: "openai-whisper" (default, unchanged) or "faster-whisper".
    # faster-whisper = same large-v3, same settings above, same single whole-file pass,
    # no VAD, greedy decoding (beam 1) — only the engine differs. Needs: pip install faster-whisper (in dub_asr)
    backend:                      "faster-whisper"
    faster_whisper_compute_type:  "float16"   # if 4 GB VRAM runs out: "int8_float16"
    faster_whisper_beam_size:     1           # 1 = same greedy decoding as openai-whisper

  # ----------------------------------------------------------
  # STAGE 01b — Speaker Diarization
  # ----------------------------------------------------------
  diarization:
    env_name:               "dub_diar"
    device:                 "cuda"
    max_num_speakers:       100
    distance_threshold:     0.60
    speaker_profile_min_s:  3.0
    speaker_profile_max_s:  10000.0
    hf_token:               ""

  # ----------------------------------------------------------
  # STAGE 03 — Translation
  # ----------------------------------------------------------
  translation:
    env_name:    "dub_translate"
    model:       "ai4bharat/indictrans2-en-indic-dist-200M"
    device:      "cuda"
    code_mixing: true
    keep_english:
      - named_entities
      - technical_terms
      - loanwords
      - short_neutral_words

  # ----------------------------------------------------------
  # STAGE 04 — TTS (Voice Synthesis)
  # Ref audio: dialogue slice from _vocals.wav (>= min_ref_duration_s)
  # Fallback:  speaker_profiles/speaker_XX.wav if dialogue too short
  # ----------------------------------------------------------
  tts:
    env_name:           "dub_tts"
    model:              "drbaph/OmniVoice-bf16"
    device:             "cuda"
    sample_rate:        24000
    min_ref_duration_s: 1.0

    # --- OmniVoice generation settings (passed to model.generate for every dialogue) ---------
    # The values below are OmniVoice's own defaults, so nothing changes until you edit them.
    # Delete a line (or leave it empty) to stop passing it. The LANGUAGE is not set here: it is
    # the job's target language (or a dialogue's own target language set in the editor).
    #
    # num_step: how many refinement passes. Higher = better/more complete speech, slower.
    #           16 = fast, 32 = default, 48-64 = try these if words get skipped.
    num_step: 64
    # position_temperature: randomness in choosing which part of the audio to fill next.
    #           0 = always the same choice (steady), 5.0 = default (most random).
    #           Try 0-2 if the voice is unstable or words are dropped.
    position_temperature: 5.0

  # ----------------------------------------------------------
  # STAGE 05 — Assembly
  # Background: {job_id}_no_vocals.wav (BS-Roformer BGM+SFX)
  # ----------------------------------------------------------
  assembly:
    env_name:               "dub_assembly"
    # The export mix is built at this rate. 44100 matches the original audio tracks, so the
    # exported video sounds like the preview (24000 cuts everything above 12 kHz). RAM:
    # roughly 4 arrays x duration x rate x 4 bytes (a 2-hour film ≈ 5 GB at 44100) — use 32000 or
    # 24000 for very long videos.
    sample_rate:            44100
    timestamp_tolerance_ms: 80
    fade_ms:                10
    # NO automatic loudness normalization: every dub plays at its natural level x the volume you
    # set (per dialogue, and the Mixer layers) — exactly what the preview plays.
    match_dialogue_volume:  false  # true = bring back the old automatic "as loud as the original line"
    volume_gain_min:        0.1
    volume_gain_max:        8.0
    # How a sped-up / slowed-down dub is time-stretched (pitch preserved):
    #   atempo      — closest to the browser preview (default)
    #   rubberband  — often the cleanest, needs ffmpeg built with librubberband
    #   librosa     — the old phase vocoder (robotic on speech; fallback only)
    speed_method:           "atempo"
    nonlexical_sounds:
      - "hmm"
      - "uh"
      - "ah"
      - "ha"
      - "hey"
      - "ok"
      - "okay"
      - "no"
      - "yeah"
      - "hm"
      - "um"

# ============================================================
# PIPELINE CONTROL
# ============================================================
pipeline:
  run_stages:
    - "00_vocals"
    - "01_asr"
    - "01b_diarization"
    - "03_translation"
    - "04_tts"
    - "05_assembly"
  stop_on_error: true
  restart_safe:  true